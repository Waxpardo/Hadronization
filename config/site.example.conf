# Copy to config/site.conf for one machine. The untracked file is optional.
# Repository-local defaults remain portable and are shown explicitly here.
RAW_ROOT=data/raw
WORK_ROOT=data/work

# Runtime tools may be absolute paths or command names.
# ROOT 6.30/01 example on Nikhef:
# ROOT_PREFIX=/cvmfs/alice.cern.ch/el9-x86_64/Packages/ROOT/v6-30-01-alice5-2
# ROOT_CONFIG=/cvmfs/alice.cern.ch/el9-x86_64/Packages/ROOT/v6-30-01-alice5-2/bin/root-config
# PYTHIA 8.317 example (site installation, not a user secret):
# PYTHIA8_PREFIX=/path/to/pythia-8.317
# Python 3.9.16 example:
# PYTHON=/path/to/python-3.9.16/bin/python3
# CXX=/usr/bin/g++

# Generation contacts Condor only after ./hadronization generate --submit.
# SCHEDULER_SUBMIT=/usr/bin/condor_submit
