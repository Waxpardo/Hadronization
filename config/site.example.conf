# Copy to config/site.conf for one machine. Values are parsed, not sourced.
RAW_ROOT=data/raw
WORK_ROOT=data/work

# Minimal Nikhef runtime pins. ROOT and PYTHIA versions are verified from the
# config tools; PYTHIA8DATA/Index.xml and both shared-library planes are checked.
ROOT_PREFIX=/cvmfs/alice.cern.ch/el9-x86_64/Packages/ROOT/v6-30-01-alice5-2
ROOT_VERSION=6.30.01
ROOT_GCC_PREFIX=/cvmfs/alice.cern.ch/el9-x86_64/Packages/GCC-Toolchain/v12.2.0-alice1-9
ROOT_RUNTIME_LIB_DIRS=/cvmfs/alice.cern.ch/el9-x86_64/Packages/TBB/v2021.5.0-13/lib:/cvmfs/alice.cern.ch/el9-x86_64/Packages/OpenSSL/v1.1.1m-7/lib:/cvmfs/alice.cern.ch/el9-x86_64/Packages/GSL/v1.16-10/lib:/cvmfs/alice.cern.ch/el9-x86_64/Packages/FreeType/v2.10.1-12/lib:/cvmfs/alice.cern.ch/el9-x86_64/Packages/libpng/v1.6.34-13/lib:/cvmfs/alice.cern.ch/el9-x86_64/Packages/lzma/v5.2.3-9/lib:/cvmfs/alice.cern.ch/el9-x86_64/Packages/libxml2/v2.9.3-9/lib:/cvmfs/alice.cern.ch/el9-x86_64/Packages/XRootD/v5.6.6-11/lib:/cvmfs/alice.cern.ch/el9-x86_64/Packages/protobuf/v21.9-13/lib:/cvmfs/alice.cern.ch/el9-x86_64/Packages/FFTW3/v3.3.9-14/lib
PYTHIA8_PREFIX=/path/to/stock-pythia-8.317/install
PYTHIA8_VERSION=8.317
PYTHIA8_GCC_PREFIX=/cvmfs/alice.cern.ch/el9-x86_64/Packages/GCC-Toolchain/v14.2.0-alice2-2
PYTHIA8DATA=/path/to/stock-pythia-8.317/install/share/Pythia8/xmldoc
CXX=/cvmfs/alice.cern.ch/el9-x86_64/Packages/GCC-Toolchain/v14.2.0-alice2-2/bin/g++

# Scheduler contact occurs only through generate --submit and remains explicit.
SCHEDULER_SUBMIT=/usr/bin/condor_submit
