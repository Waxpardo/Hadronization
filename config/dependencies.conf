# Dependency locations and pinned versions for the Hadronization chain.
#
# This file is sourced by setupEnv.sh.  Every entry uses the
#     : "${NAME:=default}"
# form, so a value already exported in the environment always wins over the
# default recorded here.  Resolution order is therefore:
#
#   1. an exported environment variable
#   2. config/dependencies.local.conf        (untracked, machine-specific)
#   3. this file                             (tracked defaults)
#
# Point HADRONIZATION_DEPENDENCIES_CONF at another file to replace (1)+(3)
# entirely.
#
# WHY VERSIONS ARE LISTED SEPARATELY FROM PATHS
# ---------------------------------------------
# While every dependency came from CVMFS, the package path encoded its
# version: /cvmfs/.../pythia/v8315-alice1-23 could not silently become a
# different PYTHIA.  PYTHIA is now a locally built stock upstream release, so
# the path no longer carries that guarantee -- a rebuild in place could change
# the generator without changing any recorded string.  setupEnv.sh therefore
# asserts the interpreter/library actually reports HF_PYTHIA8_VERSION, which
# restores the property the CVMFS pin used to provide for free.
#
# See ValidationReports/PYTHIA_JUNCTION_HANG_20260731.md for why PYTHIA moved
# off the CVMFS package.

# ---------------------------------------------------------------------------
# PYTHIA -- stock upstream release, built from the official pythia.org tarball.
# ---------------------------------------------------------------------------
# Source tarball sha256:
#   1ae551d14dac495ddfe6b344792035ebe410fe6c6004d44a335e0ece0e745adf
# Built unmodified with -std=c++20 to match the standard ROOT's --cflags
# imposes on the producer translation unit.
: "${HF_PYTHIA8_PREFIX:=/data/alice/ipardoza/pythia_stock_8317/install}"
: "${HF_PYTHIA8_VERSION:=8.317}"

# Compiler runtime the PYTHIA build and the producer are linked against.
: "${HF_PYTHIA8_GCC_PREFIX:=/cvmfs/alice.cern.ch/el9-x86_64/Packages/GCC-Toolchain/v14.2.0-alice2-2}"

# ---------------------------------------------------------------------------
# ROOT -- still the pinned ALICE CVMFS package.
# ---------------------------------------------------------------------------
: "${HF_ROOT_PREFIX:=/cvmfs/alice.cern.ch/el9-x86_64/Packages/ROOT/v6-30-01-alice5-2}"
# Must match `root-config --version` exactly, which reports 6.30.01 (dotted),
# not the 6.30/01 form used in the package name.
: "${HF_ROOT_VERSION:=6.30.01}"
: "${HF_ROOT_ALIENV_PACKAGE:=VO_ALICE@ROOT::v6-30-01-alice5-2}"

# Compiler runtime the pinned ROOT build needs.  This is deliberately a
# different toolchain from HF_PYTHIA8_GCC_PREFIX: the CVMFS ROOT package was
# built against v12.2.0 and the PYTHIA/producer side against v14.2.0.
: "${HF_ROOT_GCC_PREFIX:=/cvmfs/alice.cern.ch/el9-x86_64/Packages/GCC-Toolchain/v12.2.0-alice1-9}"

# Shared-library directories the pinned ROOT build loads at runtime, used only
# when alienv cannot initialise and setupEnv.sh falls back to raw CVMFS paths.
HF_ROOT_RUNTIME_LIB_DIRS=(
  "${HF_ROOT_GCC_PREFIX}/lib64"
  "/cvmfs/alice.cern.ch/el9-x86_64/Packages/TBB/v2021.5.0-13/lib"
  "/cvmfs/alice.cern.ch/el9-x86_64/Packages/OpenSSL/v1.1.1m-7/lib"
  "/cvmfs/alice.cern.ch/el9-x86_64/Packages/GSL/v1.16-10/lib"
  "/cvmfs/alice.cern.ch/el9-x86_64/Packages/FreeType/v2.10.1-12/lib"
  "/cvmfs/alice.cern.ch/el9-x86_64/Packages/libpng/v1.6.34-13/lib"
  "/cvmfs/alice.cern.ch/el9-x86_64/Packages/lzma/v5.2.3-9/lib"
  "/cvmfs/alice.cern.ch/el9-x86_64/Packages/libxml2/v2.9.3-9/lib"
  "/cvmfs/alice.cern.ch/el9-x86_64/Packages/XRootD/v5.6.6-11/lib"
  "/cvmfs/alice.cern.ch/el9-x86_64/Packages/protobuf/v21.9-13/lib"
  "/cvmfs/alice.cern.ch/el9-x86_64/Packages/FFTW3/v3.3.9-14/lib"
)
