: "${HADRONIZATION_MERGED_ROOT:=${HADRONIZATION_DATA_ROOT}/hadronization_merged}"
: "${HADRONIZATION_SYSTEMATICS_ROOT:=${HADRONIZATION_DATA_ROOT}/systematics_harvest}"
: "${HF_PRODUCTION_ROOT:=${HADRONIZATION_DATA_ROOT}/hadronization_production}"
