# Nikhef execution profile. The checkout may live anywhere; campaign state and
# large ROOT data live below the user's data area and never inside Git.
: "${HADRONIZATION_DATA_ROOT:=/data/alice/${USER}/hf}"
: "${HADRONIZATION_ANALYSIS_ROOT:=${HADRONIZATION_DATA_ROOT}/hadronization_analysis}"
: "${HADRONIZATION_MERGED_ROOT:=${HADRONIZATION_DATA_ROOT}/hadronization_merged}"
: "${HADRONIZATION_SYSTEMATICS_ROOT:=${HADRONIZATION_DATA_ROOT}/systematics_harvest}"
: "${HF_PRODUCTION_ROOT:=${HADRONIZATION_DATA_ROOT}/hadronization_production}"

# The campaign producer uses the verified stock 8.317 build in the shared data
# plane. Keeping this site-specific location here makes a fresh Nikhef clone
# runnable without an ignored dependency override.
: "${HF_PYTHIA8_PREFIX:=${HADRONIZATION_DATA_ROOT}/project/deploys/pythia_stock_8317/install}"
