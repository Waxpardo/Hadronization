# Nikhef execution profile. The checkout may live anywhere; campaign state and
# large ROOT data live below the account's data area and never inside Git.
#
# What this profile guarantees. HADRONIZATION_DATA_ROOT resolves without reading
# the environment, or the run stops here. The account segment comes from
# `id -un`, which reads the process credential; it does not come from ${USER}.
# A Condor job starts with getenv = False and no `environment =` line, so
# ${USER} was empty on the execute node, /data/alice//hf collapsed to the shared
# /data/alice/hf, and the first HF_SMOKE3 pilot wrote outside the account
# without anything refusing.
#
# How it refuses. An empty account name stops the run, and so does a resolved
# HADRONIZATION_DATA_ROOT that is relative, that carries an empty path segment,
# or that ends with a separator. Every refusal names the site, the variable and
# the value, and returns non-zero to setupEnv.sh, which stops before any job
# logic runs. There is no fallback of any shape, and an exported
# HADRONIZATION_DATA_ROOT is checked by the same rules.
#
# The account is then checked against the filesystem. `id -un` answers which
# account the process runs as, so a pool, glidein or uid-mapped account gives a
# well-formed root that no shape rule can reject; /data/alice/<account> must
# exist, or the run stops here. That also means this profile refuses on a host
# that carries no Nikhef storage, which is correct: nothing below /data/alice
# can be read or written there.
#
hf_site_guard="$(dirname "${BASH_SOURCE[0]}")/site_guard.sh"
if [[ ! -f "${hf_site_guard}" ]]; then
  printf 'ERROR: config/sites/nikhef.conf cannot load its shared guard: %s\n' \
    "${hf_site_guard}" >&2
  unset hf_site_guard
  return 1 2>/dev/null || exit 1
fi
# shellcheck source=/dev/null
source "${hf_site_guard}"
unset hf_site_guard

hf_nikhef_account="$(hf_site_account)"
if [[ -z "${hf_nikhef_account}" ]]; then
  hf_site_refuse "config/sites/nikhef.conf" \
    "the account name is empty, so the data root would carry an empty path segment; 'id -un' produced nothing"
  unset hf_nikhef_account
  return 1 2>/dev/null || exit 1
fi

# The storage parent is named once. The account guard below asserts a directory
# below it, and a second copy of the literal would drift from this one.
hf_nikhef_storage="/data/alice"
: "${HADRONIZATION_DATA_ROOT:=${hf_nikhef_storage}/${hf_nikhef_account}/hf}"
if ! hf_site_check_root "config/sites/nikhef.conf" HADRONIZATION_DATA_ROOT "${HADRONIZATION_DATA_ROOT}"; then
  unset hf_nikhef_account hf_nikhef_storage
  return 1 2>/dev/null || exit 1
fi
# The shape rules accept a well-formed root built from the wrong account, so the
# account itself is checked last, against the one fact that separates a real
# account from a pool account: its data directory exists.
if ! hf_site_require_account_dir "config/sites/nikhef.conf" \
     "${hf_nikhef_storage}" "${hf_nikhef_account}"; then
  unset hf_nikhef_account hf_nikhef_storage
  return 1 2>/dev/null || exit 1
fi
HADRONIZATION_SITE_ACCOUNT="${hf_nikhef_account}"
unset hf_nikhef_account hf_nikhef_storage

: "${HADRONIZATION_ANALYSIS_ROOT:=${HADRONIZATION_DATA_ROOT}/hadronization_analysis}"
: "${HADRONIZATION_MERGED_ROOT:=${HADRONIZATION_DATA_ROOT}/hadronization_merged}"
: "${HADRONIZATION_SYSTEMATICS_ROOT:=${HADRONIZATION_DATA_ROOT}/systematics_harvest}"
: "${HADRONIZATION_RESULTS_ROOT:=${HADRONIZATION_DATA_ROOT}/project/results}"
: "${HF_PRODUCTION_ROOT:=${HADRONIZATION_DATA_ROOT}/hadronization_production}"

# The campaign producer uses the verified stock 8.317 build in the shared data
# plane. Keeping this site-specific location here makes a fresh Nikhef clone
# runnable without an ignored dependency override. That claim holds only with
# the refusals above in place: while the account segment came from ${USER}, a
# fresh clone in a Condor job resolved this prefix to a directory that does not
# exist, and "runnable" included resolving to the wrong place.
: "${HF_PYTHIA8_PREFIX:=${HADRONIZATION_DATA_ROOT}/project/deploys/pythia_stock_8317/install}"
