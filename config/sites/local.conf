# Local development profile. Full campaign data are not required for source
# checks; when local data are available, place them under this root or override
# HADRONIZATION_DATA_ROOT before sourcing setupEnv.sh.
#
# What this profile guarantees. HADRONIZATION_DATA_ROOT resolves without reading
# the environment, or the run stops here. The root sits below the checkout, and
# setupEnv.sh derives HADRONIZATION_BASE from the location of setupEnv.sh
# itself. This profile carries no account segment, so no account name enters any
# path.
#
# How it refuses. An empty HADRONIZATION_BASE stops the run, and so does a
# resolved HADRONIZATION_DATA_ROOT that is relative, that carries an empty path
# segment, or that ends with a separator. The Nikhef profile met that failure on
# the cluster: an empty variable inside a path leaves a path that still
# resolves, so the wrong directory is used and nothing complains. There is no
# fallback of any shape, and an exported HADRONIZATION_DATA_ROOT is checked by
# the same rules.
#
hf_site_guard="$(dirname "${BASH_SOURCE[0]}")/site_guard.sh"
if [[ ! -f "${hf_site_guard}" ]]; then
  printf 'ERROR: config/sites/local.conf cannot load its shared guard: %s\n' \
    "${hf_site_guard}" >&2
  unset hf_site_guard
  return 1 2>/dev/null || exit 1
fi
# shellcheck source=/dev/null
source "${hf_site_guard}"
unset hf_site_guard

if [[ -z "${HADRONIZATION_DATA_ROOT:-}" && -z "${HADRONIZATION_BASE:-}" ]]; then
  hf_site_refuse "config/sites/local.conf" \
    "HADRONIZATION_BASE is empty, so the data root would carry an empty path segment; source setupEnv.sh instead of this file"
  return 1 2>/dev/null || exit 1
fi

: "${HADRONIZATION_DATA_ROOT:=${HADRONIZATION_BASE}/.local-data}"
if ! hf_site_check_root "config/sites/local.conf" HADRONIZATION_DATA_ROOT "${HADRONIZATION_DATA_ROOT}"; then
  return 1 2>/dev/null || exit 1
fi

: "${HADRONIZATION_ANALYSIS_ROOT:=${HADRONIZATION_DATA_ROOT}/hadronization_analysis}"
: "${HADRONIZATION_MERGED_ROOT:=${HADRONIZATION_DATA_ROOT}/hadronization_merged}"
: "${HADRONIZATION_SYSTEMATICS_ROOT:=${HADRONIZATION_DATA_ROOT}/systematics_harvest}"
: "${HADRONIZATION_RESULTS_ROOT:=${HADRONIZATION_DATA_ROOT}/project/results}"
: "${HF_PRODUCTION_ROOT:=${HADRONIZATION_DATA_ROOT}/hadronization_production}"
